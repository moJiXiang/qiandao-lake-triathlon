<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #1c2834; }
    #map { width: 100%; height: 100%; }
    .panel {
      position: absolute; top: 14px; left: 14px; z-index: 100;
      width: 292px; max-height: calc(100% - 28px); overflow: auto;
      background: rgba(255,255,255,0.96); backdrop-filter: blur(10px);
      border-radius: 14px; padding: 14px 14px 12px;
      box-shadow: 0 8px 28px rgba(16, 42, 67, 0.18);

    h3 { margin: 2px 0 10px; font-size: 16px; font-weight: 750; }
    .btn-group, .speeds { display: flex; gap: 6px; margin-bottom: 8px; }
    .btn-group button, .speeds button, .play-controls button {
      border-radius: 8px; cursor: pointer; font-size: 13px;

    .btn-group button, .speeds button {

    }
    .btn-group button.active, .speeds button.active {

    .play-controls { display: flex; gap: 6px; }
    .play-controls button { flex: 1; padding: 8px 0; border: none; font-weight: 650; }
    #btn-play { background: #0b6e8a; color: #fff; }
    #btn-pause { background: #e8eef2; color: #234; }
    #btn-reset { background: #f3f6f8; color: #234; }
    .play-controls button:disabled { opacity: 0.45; cursor: not-allowed; }
    .status { margin-top: 10px; background: #f4f8fa; border-radius: 10px; padding: 8px 10px; }
    .status .leg { font-size: 14px; font-weight: 750; }
    .status .sub { margin-top: 2px; font-size: 12px; color: #4d6474; line-height: 1.45; }
    .bar { margin-top: 8px; height: 8px; background: #d9e3ea; border-radius: 99px; cursor: pointer; position: relative; }
    .bar > i { display: block; height: 100%; width: 0%; border-radius: 99px; background: #0b6e8a; }
    .legend { margin-top: 10px; font-size: 12px; color: #3d5160; line-height: 1.7; }
    .legend-item { display: flex; align-items: center; gap: 7px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .note { margin-top: 8px; font-size: 11px; color: #8aa; line-height: 1.45; }
    .edit-row { display: flex; gap: 6px; margin-top: 8px; }
    .edit-row button {
      flex: 1; padding: 7px 0; border: 1.5px solid #d5dee6; border-radius: 8px;
      background: #fff; color: #345; font-size: 13px; cursor: pointer;
    }
    #btn-edit.active { border-color: #c2410c; background: #fff4ed; color: #c2410c; font-weight: 700; }
    .edit-tools { display: none; margin-top: 8px; }
    .panel.editing .edit-tools { display: block; }
    .route-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 7px; }
    .route-grid button, .point-actions button, .point-grid button {
      padding: 6px 4px; font-size: 12px; cursor: pointer;
      border: 1.5px solid #d5dee6; background: #fff; border-radius: 8px; color: #234;
    }
    .route-grid button.active, .point-actions button.active, .point-grid button.active {
      border-color: #c2410c; background: #fff4ed; color: #c2410c; font-weight: 700;
    }
    .point-actions { display: flex; gap: 6px; margin-bottom: 7px; }
    .point-actions button { flex: 1; }
    .point-actions button:disabled { opacity: .42; cursor: not-allowed; }
    .point-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px;
      max-height: 116px; overflow: auto; padding-right: 2px;
    }
    .point-grid button { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #edit-hint { display: none; color: #9a3412; }
    #anchor-export {
      display: none; width: 100%; box-sizing: border-box; margin-top: 8px;
      min-height: 88px; padding: 6px; resize: vertical;
      border: 1px solid #d5dee6; border-radius: 8px;
      font: 11px/1.45 ui-monospace, Consolas, monospace; color: #234;
    }
    #anchor-export.show { display: block; }
    .panel.editing #edit-hint { display: block; }
    .edit-pin {
      position: relative; border-radius: 50%; border: 3px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,.35); transform: translate(-50%, -50%); cursor: grab;
    }
    .edit-pin span {
      position: absolute; left: calc(100% + 6px); top: 50%; transform: translateY(-50%);
      background: #fff; color: #1c2834; font-size: 12px; font-weight: 700;
      padding: 2px 7px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,.16);
      white-space: nowrap; pointer-events: none;
    }
    .athlete-label {
      background: #fff; border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,.18); white-space: nowrap;
    }
  </style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <div class="eyebrow">2026 STC QIAN DAO LAKE</div>
  <h3>千岛湖铁三路线</h3>
  <div class="btn-group">
    <button id="btn-olympic" class="active" type="button">标铁 OD</button>
    <button id="btn-113" type="button">大铁 113</button>
  </div>
  <div class="play-controls">
    <button id="btn-play" type="button">播放</button>
    <button id="btn-pause" type="button" disabled>暂停</button>
    <button id="btn-reset" type="button" disabled>重置</button>
  </div>
  <div class="speeds" style="margin-top:8px">
    <button type="button" data-speed="0.5">0.5×</button>
    <button type="button" data-speed="1" class="active">1×</button>
    <button type="button" data-speed="2">2×</button>
    <button type="button" data-speed="4">4×</button>
  </div>
  <div class="edit-row">
    <button id="btn-edit" type="button">编辑点位</button>
    <button id="btn-copy" type="button">复制坐标</button>
    <button id="btn-restore" type="button">恢复默认</button>
  </div>
  <textarea id="anchor-export" readonly spellcheck="false"></textarea>
  <div class="edit-tools">
    <div class="route-grid" id="route-grid">
      <button type="button" data-route="swim">游泳</button>
      <button type="button" data-route="exit">至换项</button>
      <button type="button" data-route="bike" class="active">骑行</button>
      <button type="button" data-route="run">跑步</button>
      <button type="button" data-route="venue">换项区</button>
    </div>
    <div class="point-actions">
      <button id="btn-add-point" type="button">＋ 增加途经点</button>
      <button id="btn-delete-point" type="button">删除选中点</button>
    </div>
    <div class="point-grid" id="point-grid"></div>
  </div>
  <div class="note" id="edit-hint">选择一条线路，可逐点拖动，或点击“增加途经点”后在地图上落点。</div>
  <div class="status">
    <div class="leg" id="leg-name">准备就绪</div>
    <div class="sub" id="leg-sub">标铁：游泳 1.5 km · 骑行 45 km · 跑步 10.55 km</div>
  </div>
  <div class="bar" id="bar" title="拖动进度"><i id="bar-fill"></i></div>
  <div class="legend">
    <div class="legend-item"><span class="dot" style="background:#2196F3"></span> 游泳 · 进贤湾码头逆时针绕标</div>
    <div class="legend-item"><span class="dot" style="background:#FF9800"></span> T1 · 游泳出口到换项区，可加途经点</div>
    <div class="legend-item"><span class="dot" style="background:#4CAF50"></span> 骑行 · 单圈 45 km，113 组 2 圈</div>
    <div class="legend-item"><span class="dot" style="background:#E91E63"></span> 跑步 · 单圈 10.55 km，113 组 2 圈</div>
  </div>
  <div class="note">游泳在进贤湾码头外水道绕标。骑行沿淳开线、环左线、左光线、丰茂大桥、文左线到东北湖区游客中心后原路折返。跑步沿内侧绿道顺时针到远端折返后原路返回。播放里程按官方距离计算。</div>
</div>
<script>
const BIKE_OUT = [[119.034269,29.642338],[119.023625,29.652339],[119.024808,29.678079],[119.028116,29.682996],[119.039541,29.68328],[119.059407,29.679889],[119.076842,29.699695],[119.098349,29.700318],[119.117923,29.716484],[119.140848,29.73098],[119.162406,29.740787]];
const SWIM = { "113": [[119.037696,29.643354],[119.038412,29.643854],[119.039036,29.644641],[119.0396,29.64579],[119.039901,29.64712],[119.039715,29.648568],[119.03954,29.649066],[119.039542,29.649289],[119.039435,29.649409],[119.039422,29.648592],[119.039608,29.647143],[119.039307,29.645814],[119.038742,29.644664],[119.038118,29.643878],[119.037402,29.643377]], olympic: [[119.037696,29.643354],[119.038308,29.644108],[119.0389,29.644875],[119.039435,29.645592],[119.040196,29.646739],[119.041585,29.648682],[119.041253,29.648968],[119.040288,29.647579],[119.039568,29.646467],[119.03907,29.645729],[119.038468,29.644844],[119.03807,29.644293],[119.037428,29.643454]] };
const RUN_OUT = [[119.034291,29.64236],[119.02366,29.65229],[119.031578,29.657129],[119.028898,29.67284],[119.042173,29.682692]];
const DEFAULT_VENUE = [119.034029, 29.642764];
let venue = DEFAULT_VENUE.slice();

const BIKE_MARKS = [
  [0.00, "淳开线"],
  [0.15, "环左线"],
  [0.20, "进贤湾大桥"],
  [0.35, "毛岭隧道"],
  [0.40, "下栏坞隧道"],
  [0.56, "左光线"],
  [0.69, "丰茂大桥"],
  [0.81, "文左线"],
  [1.00, "东北湖区游客中心"]
];

const RACE_META = {
  olympic: { swim: 1.5, bikeLaps: 1, runLaps: 1, total: 57.05, label: "标铁" },
  "113": { swim: 1.9, bikeLaps: 2, runLaps: 2, total: 113, label: "大铁 113" }
};

let map, race = "olympic", speed = 1, editMode = false, didFit = false, draggingId = null;
let timer = null, playing = false, clock = 0, lastTs = 0;
let athlete = null, athleteLabel = null, progressLine = null;
let staticLines = [], markers = [], doneLines = [];
let drawnSlice = -1;
let timeline = [];
let framedKey = "";

function hav(a, b) {
  const R = 6371000;
  const r = Math.PI / 180;
  const dLat = (b[1] - a[1]) * r, dLng = (b[0] - a[0]) * r;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
}
function densify(path, step) {
  if (!path.length) return [];
  const out = [[path[0][0], path[0][1]]];
  for (let i = 1; i < path.length; i++) {
    const d = hav(path[i - 1], path[i]);
    const n = Math.max(1, Math.ceil(d / step));
    for (let k = 1; k <= n; k++) {
      const t = k / n;
      out.push([
        path[i - 1][0] + (path[i][0] - path[i - 1][0]) * t,
        path[i - 1][1] + (path[i][1] - path[i - 1][1]) * t
      ]);
    }
  }
  return out;
}
function outAndBack(out) {
  if (out.length < 2) return [];
  const back = out.slice(0, -1).reverse();
  return densify(out.concat(back), 40);
}
function atFraction(path, f) {
  if (f <= 0) return path[0];
  if (f >= 1) return path[path.length - 1];
  const idx = f * (path.length - 1);
  const i = Math.floor(idx);
  const t = idx - i;
  const a = path[i], b = path[Math.min(path.length - 1, i + 1)];
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
}
function sliceFraction(path, f) {
  const n = Math.max(2, Math.round(f * (path.length - 1)) + 1);
  const cut = path.slice(0, n);
  cut.push(atFraction(path, f));
  return cut;
}

function pathMeters(path) {
  let meters = 0;
  for (let i = 1; i < path.length; i++) meters += hav(path[i - 1], path[i]);
  return meters;
}
function transitionHold(path) {
  return Math.min(7, Math.max(3.6, pathMeters(path) / 90));
}
function buildTimeline() {
  const meta = RACE_META[race];
  const swim = densify(SWIM[race], 18);
  const t1 = densify(shorePath().concat([anchors.bikeStart]), 12);
  const bike = outAndBack(BIKE_OUT);
  const run = outAndBack(RUN_OUT);
  const t2 = densify([anchors.venue, anchors.runStart], 12);
  const segs = [
    { name: "游泳", color: "#2196F3", km: meta.swim, laps: 1, path: swim, kind: "swim" },
    { name: "T1 换项", color: "#FF9800", km: 0, laps: 1, path: t1, kind: "t", hold: transitionHold(t1) },
    { name: "自行车", color: "#4CAF50", km: 45, laps: meta.bikeLaps, path: bike, kind: "bike" },
    { name: "T2 换项", color: "#FF9800", km: 0, laps: 1, path: t2, kind: "t", hold: transitionHold(t2) },
    { name: "跑步", color: "#E91E63", km: 10.55, laps: meta.runLaps, path: run, kind: "run" }
  ];
  timeline = [];
  segs.forEach(seg => {
    for (let lap = 0; lap < seg.laps; lap++) {
      timeline.push({ seg, lap, km: seg.km, dur: 0 });
    }
  });
  const kmSum = raceKm() || 1;
  timeline.forEach(slice => {
    slice.dur = slice.km > 0 ? (slice.km / kmSum) * 48 : (slice.seg.hold || 1.6);
  });
  return segs;
}

function raceKm() {
  return timeline.reduce((s, t) => s + t.km, 0);
}
function totalDur() {
  return timeline.reduce((s, t) => s + t.dur, 0);
}
function locateClock(t) {
  let left = Math.max(0, t);
  for (let i = 0; i < timeline.length; i++) {
    const slice = timeline[i];
    if (left <= slice.dur || i === timeline.length - 1) {
      const f = slice.dur ? Math.min(1, left / slice.dur) : 1;
      const into = slice.km * f;
      const done = timeline.slice(0, i).reduce((s, x) => s + x.km, 0) + into;
      return { slice, f, into, done, i };
    }
    left -= slice.dur;
  }
}
function clockForKm(km) {
  let left = Math.max(0, km), t = 0;
  for (const slice of timeline) {
    if (slice.km <= 0) { t += slice.dur; continue; }
    if (left <= slice.km) return t + slice.dur * (left / slice.km);
    left -= slice.km;
    t += slice.dur;
  }
  return totalDur();
}

function roadName(f) {
  const outbound = f <= 0.5;
  const u = outbound ? f * 2 : (1 - f) * 2;
  let name = BIKE_MARKS[0][1];
  for (const m of BIKE_MARKS) if (u + 1e-6 >= m[0]) name = m[1];
  return (outbound ? "去程 · " : "返程 · ") + name;
}

function clearDrawn() {
  staticLines.forEach(l => l.setMap(null));
  markers.forEach(m => m.setMap(null));
  staticLines = []; markers = [];
  if (progressLine) { progressLine.setMap(null); progressLine = null; }
  doneLines.forEach(l => l.setMap(null));
  doneLines = [];
  drawnSlice = -1;
  if (athlete) { athlete.setMap(null); athlete = null; }
  if (athleteLabel) { athleteLabel.setMap(null); athleteLabel = null; }
}
function addLine(path, color, weight, opacity, z) {
  const line = new AMap.Polyline({
    path,
    strokeColor: color,
    strokeWeight: Math.max(weight, 6),
    strokeOpacity: Math.max(opacity, 0.95),
    isOutline: true,
    outlineColor: "#ffffff",
    borderWeight: 2,
    lineJoin: "round",
    lineCap: "round",
    zIndex: z || 50,
    map
  });
  staticLines.push(line);
  return line;
}
function addMarker(pos, title, color) {
  const marker = new AMap.Marker({
    position: pos, map, title,
    content: `<div style="background:${color};color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25);white-space:nowrap;border:2px solid #fff">${title}</div>`,
    offset: new AMap.Pixel(-8, -14),
    zIndex: 120
  });
  markers.push(marker);
}
function addBuoy(pos, text, far) {
  const marker = new AMap.CircleMarker({
    center: pos, radius: far ? 7 : 5, map,
    strokeColor: far ? "#c62828" : "#0d47a1", strokeWeight: 2,
    fillColor: far ? "#ff7043" : "#ffffff", fillOpacity: 0.95, zIndex: 80
  });
  markers.push(marker);
  if (text) {
    const label = new AMap.Text({
      text, position: pos, map,
      offset: new AMap.Pixel(8, -8),
      style: { "background": "transparent", "border": "none", "color": "#083", "font-size": "11px", "font-weight": "700", "text-shadow": "0 1px 2px #fff" },
      zIndex: 81
    });
    markers.push(label);
  }
}

function renderCourse() {
  clearDrawn();
  const segs = buildTimeline();
  segs.forEach(seg => {
    if (seg.path.length < 2) return;
    addLine(seg.path, seg.color, seg.kind === "t" ? 4 : 5, 0.28, 40);
  });
  const swim = segs[0].path;
  const buoyStep = race === "113" ? 0.12 : 0.16;
  for (let f = buoyStep; f < 0.48; f += buoyStep) addBuoy(atFraction(swim, f), "", false);
  addBuoy(atFraction(swim, 0.5), "", true);
  if (!editMode) {
    addMarker(venue, "换项区 · 进贤湾", "#0b6e8a");
    addMarker(atFraction(swim, 0.5), race === "113" ? "游泳折返 1.9km" : "游泳折返 1.5km", "#1565c0");
    addMarker(anchors.bikeFar, "骑行折返 · 东北湖区游客中心", "#2e7d32");
    addMarker(anchors.runFar, "跑步折返", "#c2185b");
  }
  if (!didFit && bikeRoad && runRoad) {
    map.setFitView(staticLines, false, [70, 40, 330, 40]);
    didFit = true;
  }
  if (editMode) syncEditHandles();
  clock = 0;
  updateHud();
}

function framePlayback(seg) {
  const key = seg.kind === "t" ? race + ":" + seg.name : "course";
  if (!map || framedKey === key) return;
  framedKey = key;
  if (seg.kind === "t" && seg.path && seg.path.length > 1) {
    map.setFitView([new AMap.Polyline({ path: seg.path })], false, [100, 100, 380, 80], 17);
  } else if (staticLines.length) {
    map.setFitView(staticLines, false, [70, 40, 330, 40]);
  }
}
function ensureAthlete(color) {
  if (!athlete) {
    athlete = new AMap.CircleMarker({
      center: venue, radius: 8, map,
      strokeColor: "#fff", strokeWeight: 3,
      fillColor: color, fillOpacity: 1, zIndex: 300
    });
    athleteLabel = new AMap.Marker({
      position: venue, map, offset: new AMap.Pixel(12, -14), zIndex: 301,
      content: `<div class="athlete-label" id="athlete-text"></div>`
    });
  }
  athlete.setOptions({ fillColor: color });
}
function setAthlete(pos, text, color) {
  ensureAthlete(color);
  athlete.setCenter(pos);
  athleteLabel.setPosition(pos);
  const el = document.getElementById("athlete-text");
  if (el) el.textContent = text;
}

function syncDoneLines(upTo) {
  if (drawnSlice === upTo) return;
  doneLines.forEach(l => l.setMap(null));
  doneLines = [];
  for (let i = 0; i < upTo; i++) {
    const slice = timeline[i];
    if (slice.seg.kind === "t") continue;
    doneLines.push(new AMap.Polyline({
      path: slice.seg.path, map,
      strokeColor: slice.seg.color, strokeWeight: 7, strokeOpacity: 1,
      isOutline: true, outlineColor: "#ffffff", borderWeight: 2,
      lineJoin: "round", lineCap: "round", zIndex: 170, showDir: true
    }));
  }
  drawnSlice = upTo;
}

function updateHud() {
  if (editMode) {
    document.getElementById("leg-name").textContent = "编辑模式";
    document.getElementById("leg-sub").textContent = `正在编辑${ROUTE_LABELS[editRoute]}线路 · 可拖动或增删途经点`;
    document.getElementById("bar-fill").style.width = "0%";
    if (athlete) athlete.hide();
    if (athleteLabel) athleteLabel.hide();
    return;
  }
  if (athlete) athlete.show();
  if (athleteLabel) athleteLabel.show();
  const meta = RACE_META[race];
  const pos = locateClock(clock);
  const seg = pos.slice.seg;
  const done = pos.done;
  document.getElementById("leg-name").textContent = seg.name + (seg.laps > 1 ? ` · 第 ${pos.slice.lap + 1}/${seg.laps} 圈` : "");
  let detail = "";
  if (seg.kind === "swim") detail = `逆时针绕标 ${pos.into.toFixed(2)} / ${seg.km.toFixed(1)} km`;
  else if (seg.kind === "bike") detail = `${roadName(pos.f)} · ${pos.into.toFixed(2)} / ${seg.km.toFixed(0)} km`;
  else if (seg.kind === "run") detail = `${pos.f <= 0.5 ? "去程 · 内侧绿道" : "返程 · 原路折返"} · ${pos.into.toFixed(2)} / ${seg.km.toFixed(2)} km`;
  else detail = `${seg.name.startsWith("T1") ? "上岸前往换项区" : "前往换项区"} ${(pos.f * 100).toFixed(0)}%`;
  document.getElementById("leg-sub").textContent = `${detail} · 全程 ${done.toFixed(2)} / ${meta.total} km`;
  document.getElementById("bar-fill").style.width = (meta.total ? (done / meta.total) * 100 : 0) + "%";
  const wherePath = seg.path && seg.path.length > 1 ? seg.path : null;
  if (!wherePath) return;
  const where = atFraction(wherePath, pos.f);
  framePlayback(seg);
  setAthlete(where, seg.name, seg.color);
  syncDoneLines(pos.i);
  const flat = sliceFraction(seg.path, pos.f);
  if (!progressLine) {
    progressLine = new AMap.Polyline({
      path: flat, map, strokeColor: seg.color, strokeWeight: 7, strokeOpacity: 1,
      isOutline: true, outlineColor: "#ffffff", borderWeight: 2,
      lineJoin: "round", lineCap: "round", zIndex: 180, showDir: true
    });
  } else {
    progressLine.setPath(flat);
    progressLine.setOptions({ strokeColor: seg.color });
  }
}

function stopTimer() {
  if (timer) cancelAnimationFrame(timer);
  timer = null;
  playing = false;
}
function setButtons() {
  document.getElementById("btn-play").disabled = playing || editMode || !bikeRoad || !runRoad;
  document.getElementById("btn-pause").disabled = !playing;
  document.getElementById("btn-reset").disabled = !playing && clock <= 0;
}
function frame(ts) {
  if (!playing) return;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  const meta = RACE_META[race];
  clock = Math.min(totalDur(), clock + dt * speed);
  updateHud();
  if (clock >= totalDur() - 0.02) {
    stopTimer();
    document.getElementById("leg-name").textContent = "完成";
    setButtons();
    return;
  }
  timer = requestAnimationFrame(frame);
}
function startPlay() {
  if (playing || editMode) return;
  if (clock >= totalDur() - 0.02) clock = 0;
  playing = true;
  lastTs = performance.now();
  setButtons();
  timer = requestAnimationFrame(frame);
}
function pausePlay() { stopTimer(); setButtons(); }
function resetPlay() {
  stopTimer();
  clock = 0;
  updateHud();
  document.getElementById("leg-name").textContent = "准备就绪";
  document.getElementById("leg-sub").textContent = raceSummary();
  setButtons();
}
function raceSummary() {
  const m = RACE_META[race];
  return `${m.label}：游泳 ${m.swim} km · 骑行 ${45 * m.bikeLaps} km · 跑步 ${(10.55 * m.runLaps).toFixed(2)} km`;
}
function switchRace(next) {
  if (race === next && timeline.length) return;
  stopTimer();
  race = next;
  document.getElementById("btn-olympic").classList.toggle("active", next === "olympic");
  document.getElementById("btn-113").classList.toggle("active", next === "113");
  renderCourse();
  if (editMode) refreshEditTools();
  else {
    document.getElementById("leg-name").textContent = "准备就绪";
    document.getElementById("leg-sub").textContent = raceSummary();
  }
  setButtons();
}

  data.routes.exit113 = shorePath("113").map(round);
  data.routes.bikeWaypoints = bikeWaypoints.map(round);
  data.routes.runWaypoints = runWaypoints.map(round);
  data.routes.bikePath = BIKE_OUT.map(round);
  data.routes.runPath = RUN_OUT.map(round);
  return JSON.stringify(data, null, 2);
}
function copyAnchors() {
  const text = anchorExportText();
  const box = document.getElementById("anchor-export");
  box.value = text;
  box.classList.add("show");
  box.focus();
  box.select();
  const done = (ok) => {
    document.getElementById("edit-hint").style.display = "block";
    document.getElementById("edit-hint").textContent = ok
      ? "坐标已复制。把这段贴过来，就会写进页面默认数据。"
      : "坐标已选中。按 Ctrl+C 复制后贴过来，就会写进页面默认数据。";
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => done(true)).catch(() => {
      try { done(document.execCommand("copy")); } catch (e) { done(false); }
    });
  } else {
    try { done(document.execCommand("copy")); } catch (e) { done(false); }
  }
}
function saveAnchors() {
  if (!anchorsCustom()) localStorage.removeItem(ANCHOR_KEY);
  else localStorage.setItem(ANCHOR_KEY, JSON.stringify({
    anchors,
    bike: bikeOverride,
    run: runOverride,
    swim: swimOverrides,
    bikeWaypoints,
    runWaypoints,
    exitWaypoints
  }));
  document.getElementById("btn-restore").disabled = !anchorsCustom();
}
function loadPoint(p) {
  return p && p.length === 2 && p.every(n => Number.isFinite(n)) ? [p[0], p[1]] : null;
}
function loadPath(value) {
  if (!Array.isArray(value) || value.length < 2) return null;
  const path = [];
  value.forEach(p => {
    if (p && p.length === 2 && p.every(n => Number.isFinite(n))) path.push([p[0], p[1]]);
  });
  return path.length > 1 ? path : null;
}
function loadAnchors() {
  try {
    localStorage.removeItem("qd-triathlon-anchors-v1");
    const raw = localStorage.getItem(ANCHOR_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    const data = saved.anchors || saved;
    ["venue", "swimStart", "swimFar113", "swimFarOd", "bikeStart", "bikeFar", "runStart", "runFar"].forEach(key => {
      const p = data[key];
      if (p && p.length === 2 && p.every(n => Number.isFinite(n))) anchors[key] = [p[0], p[1]];
    });
    if (saved.swim) {
      swimOverrides.olympic = loadPath(saved.swim.olympic);
      swimOverrides["113"] = loadPath(saved.swim["113"]);
    }
    const savedBikeWaypoints = Array.isArray(saved.bikeWaypoints)
      ? saved.bikeWaypoints.map(p => loadPath([p, p])?.[0]).filter(Boolean)
      : null;
    const savedRunWaypoints = Array.isArray(saved.runWaypoints)
      ? saved.runWaypoints.map(p => loadPath([p, p])?.[0]).filter(Boolean)
      : null;
    if (savedBikeWaypoints) bikeWaypoints = savedBikeWaypoints;
    if (savedRunWaypoints) runWaypoints = savedRunWaypoints;
    if (saved.exitWaypoints) {
      ["olympic", "113"].forEach(kind => {
        const points = Array.isArray(saved.exitWaypoints[kind])
          ? saved.exitWaypoints[kind].map(p => loadPoint(p)).filter(Boolean)
          : null;
        if (points) exitWaypoints[kind] = points;
      });
    }
  } catch (e) { /* keep defaults */ }
  applyDefaultRoads();
  rebuildGeometry();
}
function controlsMatchDefault(kind) {
  if (kind === "bike") {
    return pathsSame(bikeWaypoints, BIKE_VIA)
      && samePoint(anchors.bikeStart, DEFAULT_ANCHORS.bikeStart)
      && samePoint(anchors.bikeFar, DEFAULT_ANCHORS.bikeFar);
  }
  return pathsSame(runWaypoints, DEFAULT_RUN_VIA)
    && samePoint(anchors.runStart, DEFAULT_ANCHORS.runStart)
    && samePoint(anchors.runFar, DEFAULT_ANCHORS.runFar);
}
const GCJ_A = 6378245.0;
const GCJ_EE = 0.00669342162296594323;
function gcjOutOfChina(lng, lat) {
  return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271;
}
function gcjTransformLat(lng, lat) {
  let ret = -100 + 2 * lng + 3 * lat + 0.2 * lat * lat + 0.1 * lng * lat + 0.2 * Math.sqrt(Math.abs(lng));
  ret += (20 * Math.sin(6 * lng * Math.PI) + 20 * Math.sin(2 * lng * Math.PI)) * 2 / 3;
  ret += (20 * Math.sin(lat * Math.PI) + 40 * Math.sin(lat / 3 * Math.PI)) * 2 / 3;
  ret += (160 * Math.sin(lat / 12 * Math.PI) + 320 * Math.sin(lat * Math.PI / 30)) * 2 / 3;
  return ret;
}
function gcjTransformLng(lng, lat) {
  let ret = 300 + lng + 2 * lat + 0.1 * lng * lng + 0.1 * lng * lat + 0.1 * Math.sqrt(Math.abs(lng));
  ret += (20 * Math.sin(6 * lng * Math.PI) + 20 * Math.sin(2 * lng * Math.PI)) * 2 / 3;
  ret += (20 * Math.sin(lng * Math.PI) + 40 * Math.sin(lng / 3 * Math.PI)) * 2 / 3;
  ret += (150 * Math.sin(lng / 12 * Math.PI) + 300 * Math.sin(lng / 30 * Math.PI)) * 2 / 3;
  return ret;
}
function wgs84ToGcj02(lng, lat) {
  if (gcjOutOfChina(lng, lat)) return [lng, lat];
  let dLat = gcjTransformLat(lng - 105, lat - 35);
  let dLng = gcjTransformLng(lng - 105, lat - 35);
  const radLat = lat / 180 * Math.PI;
  let magic = Math.sin(radLat);
  magic = 1 - GCJ_EE * magic * magic;
  const sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180) / ((GCJ_A * (1 - GCJ_EE)) / (magic * sqrtMagic) * Math.PI);
  dLng = (dLng * 180) / (GCJ_A / sqrtMagic * Math.cos(radLat) * Math.PI);
  return [lng + dLng, lat + dLat];
}
function gcj02ToWgs84(lng, lat) {
  if (gcjOutOfChina(lng, lat)) return [lng, lat];
  let wgsLng = lng;
  let wgsLat = lat;
  for (let i = 0; i < 8; i++) {
    const gcj = wgs84ToGcj02(wgsLng, wgsLat);
    wgsLng -= gcj[0] - lng;
    wgsLat -= gcj[1] - lat;
  }
  return [wgsLng, wgsLat];
}
function toGcjPath(points) {
  return points.map(p => wgs84ToGcj02(p[0], p[1]));
}
function applyDefaultRoads() {
  if (controlsMatchDefault("bike") && DEFAULT_BIKE_ROAD.length > 1) bikeRoad = toGcjPath(DEFAULT_BIKE_ROAD);
  if (controlsMatchDefault("run") && DEFAULT_RUN_ROAD.length > 1) runRoad = toGcjPath(DEFAULT_RUN_ROAD);
}
function thinPath(pts, max) {
  if (pts.length <= max) return pts.map(p => p.slice());
  const thin = [];
  const step = (pts.length - 1) / (max - 1);
  for (let i = 0; i < max; i++) thin.push(pts[Math.round(i * step)].slice());
  thin[thin.length - 1] = pts[pts.length - 1].slice();
  return thin;
}
function roadMessage() {
  const names = [];
  if (roadPending.bike) names.push("骑行");
  if (roadPending.run) names.push("跑步");
  return names.length
    ? `正在按公路计算${names.join("和")}路线…`
    : "骑行和跑步已沿实际公路绘制，并经过每个途经点。";
}
function showRoadMessage(text) {
  const hint = document.getElementById("edit-hint");
  hint.style.display = "block";
  if (!editMode) hint.textContent = text;
  if (!editMode && !playing) document.getElementById("leg-sub").textContent = text;
}
function fetchRoad(profile, points) {
  const wgs = points.map(p => gcj02ToWgs84(p[0], p[1]));
  const coords = wgs.map(p => `${p[0].toFixed(6)},${p[1].toFixed(6)}`).join(";");
  const url = `https://router.project-osrm.org/route/v1/${profile}/${coords}?overview=full&geometries=geojson`;
  return fetch(url).then(res => res.ok ? res.json() : null).then(data => {
    const line = data && data.code === "Ok" && data.routes && data.routes[0] && data.routes[0].geometry && data.routes[0].geometry.coordinates;
    if (!line || line.length < 2) return null;
    const pts = line.map(p => wgs84ToGcj02(p[0], p[1]));
    pts[0] = points[0].slice();
    pts[pts.length - 1] = points[points.length - 1].slice();
    return thinPath(pts, 1400);
  }).catch(() => null);
}
function routeOnRoad(kind) {
  const serial = ++routeSerials[kind];
  roadPending[kind] = true;
  showRoadMessage(roadMessage());
  const stops = controlPoints(kind);
  const profiles = kind === "bike" ? ["driving"] : ["foot", "driving"];
  const tryProfile = (index) => {
    if (serial !== routeSerials[kind]) return;
    if (index >= profiles.length) {
      roadPending[kind] = false;
      const kept = kind === "bike" ? bikeRoad : runRoad;
      showRoadMessage(kept
        ? "公路规划暂时没有连上，仍显示上一次的公路路线。"
        : `${ROUTE_LABELS[kind]}路线没有规划到公路，请把途经点移到道路附近。`);
      setButtons();
      return;
    }
    fetchRoad(profiles[index], stops).then(road => {
      if (serial !== routeSerials[kind]) return;
      if (!road) { tryProfile(index + 1); return; }
      roadPending[kind] = false;
      if (kind === "bike") bikeRoad = road;
      else runRoad = road;
      rebuildGeometry();
      saveAnchors();
      renderCourse();
      if (editMode) refreshEditTools();
      showRoadMessage(roadMessage());
      setButtons();
    });
  };
  tryProfile(0);
}
function pinHtml(label, color, active) {
  const size = active ? 22 : 16;
  return `<div class="edit-pin" style="width:${size}px;height:${size}px;background:${color}"><span>${label}</span></div>`;
}
function selectEditPoint(index) {
  const points = controlPoints();
  selectedPointIndex = Math.max(0, Math.min(index, points.length - 1));
  editHandles.forEach((h, i) => {
    const on = i === selectedPointIndex;
    h.marker.setzIndex(on ? 640 : 430);
    h.marker.setContent(pinHtml(pointLabel(i, points.length), ROUTE_COLORS[editRoute], on));
  });
  document.querySelectorAll("#point-grid button").forEach((btn, i) => {
    btn.classList.toggle("active", i === selectedPointIndex);
  });
  const pos = points[selectedPointIndex];
  const label = pointLabel(selectedPointIndex, points.length);
  document.getElementById("edit-hint").textContent =
    `${ROUTE_LABELS[editRoute]} · ${label}  ${pos[0].toFixed(6)}, ${pos[1].toFixed(6)} · 可直接拖动`;
  document.getElementById("btn-delete-point").disabled =
    editRoute === "venue" || selectedPointIndex === 0 || selectedPointIndex === points.length - 1;
}
function clearEditHandles() {
  editHandles.forEach(h => h.marker.setMap(null));
  editHandles = [];
}
function syncEditHandles() {
  const points = controlPoints();
  if (!editMode) {
    clearEditHandles();
    return;
  }
  if (editHandles.length !== points.length) {
    rebuildEditHandles();
    return;
  }
  editHandles.forEach((h, i) => {
    h.marker.setMap(map);
    if (i !== draggingId) h.marker.setPosition(points[i]);
  });
}
function queueRedraw() {
  if (redrawQueued) return;
  redrawQueued = true;
  requestAnimationFrame(() => {
    redrawQueued = false;
    renderCourse();
    if (editMode) selectEditPoint(selectedPointIndex);
  });
}
function rebuildEditHandles() {
  if (typeof AMap === "undefined") return;
  clearEditHandles();
  const points = controlPoints();
  const grid = document.getElementById("point-grid");
  grid.innerHTML = "";
  points.forEach((point, index) => {
    const label = pointLabel(index, points.length);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = label;
    btn.title = `${point[0].toFixed(6)}, ${point[1].toFixed(6)}`;
    btn.onclick = () => {
      selectEditPoint(index);
      map.panTo(point);
    };
    grid.appendChild(btn);
    const marker = new AMap.Marker({
      position: point,
      map,
      draggable: true,
      cursor: "grab",
      zIndex: 430,
      offset: new AMap.Pixel(0, 0),
      content: pinHtml(label, ROUTE_COLORS[editRoute], false)
    });
    marker.on("mousedown", () => selectEditPoint(index));
    marker.on("dragging", (ev) => {
      draggingId = index;
      moveEditPoint(index, [ev.lnglat.getLng(), ev.lnglat.getLat()]);
      queueRedraw();
    });
    marker.on("dragend", () => {
      draggingId = null;
      if (editRoute === "bike" || editRoute === "run") routeOnRoad(editRoute);
      else {
        saveAnchors();
        queueRedraw();
      }
    });
    editHandles.push({ marker });
  });
  selectedPointIndex = Math.min(selectedPointIndex, points.length - 1);
  selectEditPoint(selectedPointIndex);
}
function refreshEditTools() {
  document.querySelectorAll("#route-grid button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.route === editRoute);
  });
  const add = document.getElementById("btn-add-point");
  add.disabled = editRoute === "venue";
  add.classList.toggle("active", addingWaypoint);
  add.textContent = addingWaypoint ? "点击地图放置…" : "＋ 增加途经点";
  rebuildEditHandles();
}
function switchEditRoute(kind) {
  editRoute = kind;
  selectedPointIndex = 0;
  addingWaypoint = false;
  refreshEditTools();
}
function nearestSegmentIndex(points, point) {
  let best = 0, bestDistance = Infinity;
  const cos = Math.cos(point[1] * Math.PI / 180);
  for (let i = 0; i < points.length - 1; i++) {
    const ax = points[i][0] * cos, ay = points[i][1];
    const bx = points[i + 1][0] * cos, by = points[i + 1][1];
    const px = point[0] * cos, py = point[1];
    const dx = bx - ax, dy = by - ay;
    const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy || 1)));
    const d = (px - ax - dx * t) ** 2 + (py - ay - dy * t) ** 2;
    if (d < bestDistance) { bestDistance = d; best = i; }
  }
  return best;
}
function addWaypointAt(point) {
  if (editRoute === "venue") return;
  const segment = nearestSegmentIndex(controlPoints(), point);
  if (editRoute === "swim") {
    if (!swimOverrides[race]) swimOverrides[race] = copyPath(SWIM[race]);
    swimOverrides[race].splice(segment + 1, 0, point);
  } else if (editRoute === "exit") {
    exitWaypoints[race].splice(segment, 0, point);
  } else if (editRoute === "bike") {
    bikeWaypoints.splice(segment, 0, point);
  } else {
    runWaypoints.splice(segment, 0, point);
  }
  selectedPointIndex = segment + 1;
  addingWaypoint = false;
  rebuildGeometry();
  renderCourse();
  refreshEditTools();
  if (editRoute === "bike" || editRoute === "run") routeOnRoad(editRoute);
  else saveAnchors();
}
function deleteSelectedWaypoint() {
  const points = controlPoints();
  if (editRoute === "venue" || selectedPointIndex <= 0 || selectedPointIndex >= points.length - 1) return;
  if (editRoute === "swim") {
    if (!swimOverrides[race]) swimOverrides[race] = copyPath(SWIM[race]);
    swimOverrides[race].splice(selectedPointIndex, 1);
  } else if (editRoute === "exit") {
    exitWaypoints[race].splice(selectedPointIndex - 1, 1);
  } else if (editRoute === "bike") {
    bikeWaypoints.splice(selectedPointIndex - 1, 1);
  } else {
    runWaypoints.splice(selectedPointIndex - 1, 1);
  }
  selectedPointIndex = Math.max(0, selectedPointIndex - 1);
  rebuildGeometry();
  renderCourse();
  refreshEditTools();
  if (editRoute === "bike" || editRoute === "run") routeOnRoad(editRoute);
  else saveAnchors();
}
function setEditMode(on) {
  if (on) {
    pausePlay();
    clock = 0;
  }
  editMode = on;
  addingWaypoint = false;
  document.getElementById("btn-edit").classList.toggle("active", on);
  document.querySelector(".panel").classList.toggle("editing", on);
  renderCourse();
  if (on) refreshEditTools();
  else {
    clearEditHandles();
    document.getElementById("leg-name").textContent = "准备就绪";
    document.getElementById("leg-sub").textContent = raceSummary();
  }
  setButtons();
  document.getElementById("btn-restore").disabled = !anchorsCustom();
}
function restoreAnchors() {
  localStorage.removeItem(ANCHOR_KEY);
  bikeOverride = null;
  runOverride = null;
  swimOverrides = { "113": null, olympic: null };
  exitWaypoints = { olympic: copyPath(DEFAULT_EXIT.olympic), "113": copyPath(DEFAULT_EXIT["113"]) };
  bikeWaypoints = copyPath(BIKE_VIA);
  runWaypoints = copyPath(DEFAULT_RUN_VIA);
  anchors = defaultAnchors();
  applyDefaultRoads();
  rebuildGeometry();
  renderCourse();
  if (editMode) refreshEditTools();
  routeOnRoad("bike");
  routeOnRoad("run");
  document.getElementById("btn-restore").disabled = true;
}
loadAnchors();

function initMap() {
  map = new AMap.Map("map", {
    viewMode: "3D",
    pitch: 48,
    rotation: -18,
    zoom: 13.2,
    zooms: [11, 18],
    center: [119.08, 29.69],
    layers: [
      new AMap.TileLayer.Satellite(),
      new AMap.TileLayer.RoadNet({ opacity: 0.35, zIndex: 2 })
    ]
  });
  map.addControl(new AMap.Scale());
  map.addControl(new AMap.ToolBar({ position: "RB" }));
  if (AMap.ControlBar) {
    map.addControl(new AMap.ControlBar({ position: { right: "16px", top: "16px" } }));
  }
  map.on("click", (ev) => {
    if (!editMode || !addingWaypoint) return;
    addWaypointAt([ev.lnglat.getLng(), ev.lnglat.getLat()]);
  });
  map.on("complete", () => {
    renderCourse();
    setButtons();
    if (bikeRoad && runRoad) showRoadMessage(roadMessage());
    if (!bikeRoad || !controlsMatchDefault("bike")) routeOnRoad("bike");
    if (!runRoad || !controlsMatchDefault("run")) routeOnRoad("run");
  });
}

document.getElementById("btn-olympic").onclick = () => switchRace("olympic");
document.getElementById("btn-113").onclick = () => switchRace("113");
document.getElementById("btn-play").onclick = startPlay;
document.getElementById("btn-pause").onclick = pausePlay;
document.getElementById("btn-reset").onclick = resetPlay;
document.getElementById("btn-edit").onclick = () => setEditMode(!editMode);
document.getElementById("btn-copy").onclick = copyAnchors;
document.getElementById("btn-restore").onclick = restoreAnchors;
document.getElementById("btn-restore").disabled = !anchorsCustom();
document.querySelectorAll("#route-grid button").forEach(btn => {
  btn.onclick = () => switchEditRoute(btn.dataset.route);
});
document.getElementById("btn-add-point").onclick = () => {
  if (editRoute === "venue") return;
  addingWaypoint = !addingWaypoint;
  refreshEditTools();
  document.getElementById("edit-hint").textContent = addingWaypoint
    ? `在地图上点击，为${ROUTE_LABELS[editRoute]}线路增加途经点`
    : "已取消增加途经点";
};
document.getElementById("btn-delete-point").onclick = deleteSelectedWaypoint;
document.querySelectorAll(".speeds button").forEach(btn => {
  btn.onclick = () => {
    speed = Number(btn.dataset.speed);
    document.querySelectorAll(".speeds button").forEach(b => b.classList.toggle("active", b === btn));
  };
});
document.getElementById("bar").onclick = (ev) => {
  const rect = ev.currentTarget.getBoundingClientRect();
  const f = Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
  if (editMode) return;
  clock = clockForKm(f * RACE_META[race].total);
  updateHud();
  setButtons();
};
window.addEventListener("keydown", (ev) => {
  if (ev.code === "Space" && !editMode) { ev.preventDefault(); playing ? pausePlay() : startPlay(); }
});

window.onload = function () {
  const script = document.createElement("script");
  script.src = "https://webapi.amap.com/maps?v=2.0&key=da5acba64b5928a50615ff63536596a9&plugin=AMap.Scale,AMap.ToolBar,AMap.ControlBar";
  script.onload = () => {
    if (typeof AMap === "undefined") { alert("高德地图没有加载成功，请检查 Key 与网络。"); return; }
    initMap();
  };
  document.head.appendChild(script);
};
